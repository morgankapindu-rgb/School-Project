<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering System - Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 10px;
            margin: 5px 0;
            background-color: black;
            color: white;
        }
        li:nth-child(odd) {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Food Ordering System</h1>
    <h2>Menu</h2>
    <ul>
        <li>Pizza - $12</li>
        <li>Burgers - $8</li>
        <li>Salads - $7</li>
        <li>Pasta - $10</li>
        <li>Desserts - $6</li>
    </ul>
</body>
</html>
